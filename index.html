<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mockup navegable de PGL Pulse" />
  <title>PGL Pulse · Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-page="inicio" aria-label="Ir al inicio">
        <span class="pulse-mark"><i></i><i></i><i></i><i></i><i></i></span>
        <span>PGL <b>Pulse</b></span>
      </button>
      <nav class="nav" aria-label="Navegación principal">
        <button class="nav-item active" data-page="inicio">Inicio</button>
        <button class="nav-item" data-page="compras">Compras</button>
        <button class="nav-item" data-page="ventas">Ventas</button>
        <button class="nav-item" data-page="reparto">Reparto</button>
        <button class="nav-item" data-page="stock">Stock</button>
        <button class="nav-item" data-page="datos">Datos</button>
        <button class="nav-item" data-page="reportes">Reportes</button>
      </nav>
      <div class="system-state"><span></span><div><b>Demo local</b><small>Sin conexión a Supabase</small></div></div>
      <button class="mobile-menu" aria-label="Abrir menú">☰</button>
    </header>

    <main id="app" class="workspace" tabindex="-1"></main>
  </div>

  <div class="modal-backdrop" id="modal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><div><span class="eyebrow">Vista de unidad</span><h2 id="modal-title">Detalle</h2></div><button class="modal-close" aria-label="Cerrar">×</button></header>
      <div id="modal-content"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
